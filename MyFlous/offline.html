<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" href="assets/icons/favicon.png" type="image/png">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<title>My Flous — Offline</title>
<style>
  html, body{ height: 100%; margin: 0; }
  body{
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    background: radial-gradient(120% 90% at 50% 20%, rgba(245,184,0,0.16), transparent 60%), #0A0A0C;
    color: #F5F5F7;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    text-align: center;
    padding: 32px;
  }
  .mark{
    width: 84px; height: 84px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 40px rgba(245,184,0,0.35);
    margin-bottom: 8px;
  }
  .mark img{ width: 100%; height: 100%; object-fit: contain; display: block; }
  h1{ font-size: 20px; margin: 0; }
  p{ font-size: 14px; color: #B5B5BD; max-width: 320px; line-height: 1.5; margin: 0; }
  button{
    margin-top: 12px; border: none; cursor: pointer;
    background: linear-gradient(145deg, #FFD84D, #D69E00);
    color: #16161A; font-weight: 700; font-size: 14px;
    padding: 12px 28px; border-radius: 999px;
    transition: transform 160ms ease;
  }
  button:active{ transform: scale(0.96); }
</style>
</head>
<body>
  <div class="mark"><img src="assets/images/logo.png" alt="My Flous"></div>
  <h1>You're offline</h1>
  <p>My Flous needs to load at least once online. Your existing data is safe on this device — reconnect and reopen the app.</p>
  <button onclick="location.href='./index.html'">Try again</button>
</body>
</html>
